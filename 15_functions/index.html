<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    @font-face {
      src: url("fonts/pandora.ttf");
      font-family: "Pandora";
      font-style: normal;
      font-display: swap;
    }
    body {
      background-color: hsl(0 0% 10%);
      color: hsl(0 0% 90%);
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 3.5rem;
      font-family: "Pandora"
    }
  </style>
</head>

<body>
  <h1 id="user-name"></h1>
  <script>
    "use strict"
    function greetUser(userName = "Adones") {
      let greeting = `Hello! ${userName}`;
      document.getElementById("user-name").textContent = greeting;
    }
    // console.log(greeting); // It's a local variable of the function and won't be available outside of the function

    let userName;
    userName = prompt("What do we call you?", "Anonymous");
    greetUser(userName);
    
  </script>
</body>

</html>
