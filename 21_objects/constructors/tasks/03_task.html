<body>


  <script>
    
    function Accumulator(startingValue) {
      this.currentValue = startingValue;

      this.read = function () {
        let valueToBeAdded = +prompt('Enter the Value to Add to current Value', 10);
        this.currentValue += valueToBeAdded;
      };
    }

    let accumulator = new Accumulator(11);
    alert(accumulator.currentValue)
    accumulator.read();
    alert(accumulator.currentValue);

  </script>
</body>
