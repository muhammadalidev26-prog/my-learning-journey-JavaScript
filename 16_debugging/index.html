<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      background-color: #151515;
      color: #dfdfdf;
      font-family: Verdana;
      text-align: center;
    }
    h3 {
      background-color: #353535;
      color: #0bbb0b;
      font-size: 13px;
      font-family: Arial;
      padding: 6px 10px;
      text-align: start;
      width: fit-content;
      border-radius: 15px;
    }
    button {
      padding: 15px 20px;
      font-size: 1.25rem;
      text-transform: uppercase;
      border: none;
      border-radius: 10px;
      background-color: #353535;
      color: inherit;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #444;
    }
  </style>
</head>

<body>

  <header>
    <h3>Debugging JavaScript in Browser</h3>
    <button id="btn">CLICK ME</button>
    <div  id="container"></div>
  </header>

  <script src="index.js"></script>
</body>

</html>
